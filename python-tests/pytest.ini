[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -v --strict-markers
markers =
    ui: Playwright web user interface tests
    api: REST API HTTP regression tests
    db: SQLite database persistence tests
    smoke: Smoke validation test suite
    regression: Full regression test suite
